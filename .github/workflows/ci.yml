name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: warelyn_inventoryV2
          MYSQL_USER: warelyn
          MYSQL_PASSWORD: warelyn_dev_password
          MYSQL_ROOT_PASSWORD: root_dev_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_dev_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      WARELYN_DATABASE_URL: mysql+pymysql://warelyn:warelyn_dev_password@127.0.0.1:3306/warelyn_inventory
      WARELYN_JWT_SECRET_KEY: ci-only-secret-not-for-production
      WARELYN_CORS_ORIGINS: '["http://localhost:5173"]'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Compile backend
        working-directory: backend
        run: python -m compileall app
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest
      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Build frontend
        working-directory: frontend
        run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose
        run: docker compose config >/dev/null
